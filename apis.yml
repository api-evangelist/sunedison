aid: sunedison
name: SunEdison
description: >-
  SunEdison was a renewable energy company that developed, financed, installed, owned,
  and operated solar power plants and wind energy plants globally. Originally founded as
  MEMC Electronic Materials in 1959, SunEdison became the world's leading renewable
  energy developer before filing for Chapter 11 bankruptcy in April 2016 and emerging
  as a restructured private company in 2017. No public developer API was documented.
